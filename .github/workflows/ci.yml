name: verify
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go run ./backend/workflowgen/cmd/bpmn2go --check
      - run: go generate ./backend/analytics/ent
      - run: git diff --exit-code
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go test ./backend/workflowgen/core -fuzz=FuzzParser -fuzztime=10s
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose up -d --build --wait
      - run: go test -tags=integration -count=1 ./tests/integration
        env:
          TEST_DATABASE_URL: postgres://aisleflow_app:aisleflow_demo@localhost:5432/aisleflow?sslmode=disable
      - run: docker compose run --rm demo
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
