services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_demo
      POSTGRES_DB: aisleflow
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aisleflow"]
      interval: 2s
      timeout: 2s
      retries: 30
  temporal:
    image: temporalio/temporal:1.3.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--ui-ip", "0.0.0.0"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporaldata:/data"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 3s
      retries: 30
  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres_demo@postgres:5432/aisleflow?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
  analyzer:
    build: .
    environment:
      DATABASE_URL: postgres://aisleflow_app:aisleflow_demo@postgres:5432/aisleflow?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      TELEMETRY_TOKENS: '{"demo-local-token-change-me":"demo"}'
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:14317:4317"]
    depends_on: [analyzer, jaeger]
  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://aisleflow_app:aisleflow_demo@postgres:5432/aisleflow?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      otel-collector: {condition: service_started}
  demo:
    build: .
    profiles: [demo]
    entrypoint: ["/app/demo"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: [worker]
volumes:
  pgdata:
  temporaldata:
